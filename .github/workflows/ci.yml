name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # the release runs these first

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt -r tests/requirements.txt
      - name: Lint
        run: ruff check app tests
      - name: JavaScript syntax
        run: for f in app/static/*.js tests/e2e/*.mjs; do node --check "$f"; done
      - name: JavaScript tests
        run: node --test tests/*.test.mjs
      - name: Backend tests
        run: pytest -q
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r app/requirements.txt
