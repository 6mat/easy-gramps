name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # the release runs these first

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt -r tests/requirements.txt
      - name: Lint
        run: ruff check app tests
      - name: JavaScript syntax
        run: for f in app/static/*.js tests/e2e/*.mjs; do node --check "$f"; done
      - name: JavaScript tests
        run: node --test tests/*.test.mjs
      - name: Backend tests
        run: pytest -q
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r app/requirements.txt
