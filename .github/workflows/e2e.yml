# Every screen in a real browser against the public Gramps Web demo (read-only, Member login).
# Weekly and on demand, not on every push: it depends on the demo being up.
name: Screens on the demo
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - run: pip install -r app/requirements.txt
      - name: Start Easy Gramps against the demo
        working-directory: app
        run: |
          GRAMPS_URL=https://demo.grampsweb.org BASE_PATH=/easy-gramps DATA_DIR=/tmp/eg uvicorn main:app --port 8095 &
          for i in $(seq 30); do curl -sf http://localhost:8095/easy-gramps/ >/dev/null && break; sleep 1; done
      - name: Browser
        working-directory: tests/e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Every screen (read-only)
        run: APP=http://localhost:8095/easy-gramps/ node tests/e2e/screens.mjs
