# Release: build the image for amd64 + arm64 (Raspberry Pi) and publish it to GitHub Container
# Registry as :vX.Y.Z and :latest.
#   - Easiest: Actions → Release image → Run workflow (on main). It releases the version in VERSION:
#     builds the image, then creates the tag vX.Y.Z and the GitHub release (notes from CHANGELOG.md).
#   - Or publish a release / push a tag vX.Y.Z yourself; it must match VERSION.
name: Release image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # the "Run workflow" button

permissions:
  contents: write  # the button creates the tag and the release
  packages: write

jobs:
  test:  # a release that fails the tests is never built
    uses: ./.github/workflows/ci.yml
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Which version
        id: v
        run: |
          tag="v$(cat VERSION)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF_NAME" != main ]; then
              echo "::error::Run it on main (it was run on $GITHUB_REF_NAME). Nothing was built."; exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag is already released. Merge a change that raises VERSION first, then run this again. Nothing was built."; exit 1
            fi
          elif [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but VERSION says $(cat VERSION). Nothing was built. Merge a change that sets VERSION to ${GITHUB_REF_NAME#v} first, then release that version (or delete this tag and tag $tag)."; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
      - name: Tag and publish the release (Run workflow button only, after the image is built)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          awk -v head="## ${TAG#v} " 'index($0, head) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "${TAG#v}" --notes-file notes.md
